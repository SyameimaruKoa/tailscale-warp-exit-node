services:
  # 1. WARPコンテナ (ゲートウェイ)
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: always
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
      # 【必須】NATモードを有効にする (SOCKS5は無効になる)
      - WARP_ENABLE_NAT=1
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data_warp:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      private_net:
        ipv4_address: 10.1.0.2
        ipv6_address: fd6a:204b:1e8d::2

# 2. Tailscaleコンテナ (Exit Node)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: always
    depends_on:
      warp:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # ⬇️【ここを追加】これを入れないと勝手にUserspaceモードになってしまう！
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-exit-node --accept-dns=false
      - WARP_GW=10.1.0.2
      - WARP_GW6=fd6a:204b:1e8d::2
      # 経路分離 (Issue #1) の上書き設定。通常は空・既定のままでよい
      # TS_FWMARK: tailscaledの bypass fwmark。空なら自動検出される
      - TS_FWMARK=${TS_FWMARK:-}
      - UNDERLAY_TABLE=${UNDERLAY_TABLE:-100}
    volumes:
      - ./data_tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /etc/hostname:/host_hostname:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./verify-routing.sh:/verify-routing.sh:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      # fwmark付きパケットの逆経路チェック (rp_filter) に必要 (WARP側と同設定)
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      private_net:
        ipv4_address: 10.1.0.3
        ipv6_address: fd6a:204b:1e8d::3
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

networks:
  private_net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.1.0.0/29
        - subnet: fd6a:204b:1e8d::/64
