services:
  # 1. WARPコンテナ (ゲートウェイ)
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: always
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
      # 【必須】NATモードを有効にする (SOCKS5は無効になる)
      - WARP_ENABLE_NAT=1
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data_warp:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      private_net:
        ipv4_address: 10.250.199.2
        ipv6_address: fd42:9876:5432::2
      macvlan_net: {}

# 2. Tailscaleコンテナ (Exit Node)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: always
    depends_on:
      warp:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # ⬇️【ここを追加】これを入れないと勝手にUserspaceモードになってしまう！
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-exit-node --accept-dns=false
    volumes:
      - ./data_tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /etc/hostname:/host_hostname:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      private_net:
        ipv4_address: 10.250.199.3
        ipv6_address: fd42:9876:5432::3
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

networks:
  private_net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.250.199.0/24
        - subnet: fd42:9876:5432::/64
  macvlan_net:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:-192.168.55.0/24}
          gateway: ${MACVLAN_GATEWAY:-192.168.55.1}



